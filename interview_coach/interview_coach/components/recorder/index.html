<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>면접 녹화</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 녹화 칸: 영상이 주인공. 시간·마이크·시선은 영상 위에 겹쳐서 버튼까지 한 화면에 들어오게 */
:root{
  --navy:#1b2b57; --navy-700:#13203f; --navy-50:#eef1f8; --navy-100:#dde3f0;
  --line:#e3e7ee; --ink:#161b2b; --ink-2:#4a5368; --ink-3:#8a92a6; --screen:#1c2336;
  --good:#1f8a52; --good-bg:#e7f4ec; --mid:#b26a00; --mid-bg:#fdf3e2; --low:#c2412d; --low-bg:#fbeae7;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.head b{font-size:16px;letter-spacing:-0.01em}
.chips{display:flex;gap:4px;background:var(--navy-50);border-radius:9px;padding:3px}
.chips button{height:28px;padding:0 11px;border:none;border-radius:7px;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chips button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(19,32,63,.12)}
.chips button:disabled{cursor:not-allowed;opacity:.6}
.qline{font-size:14px;color:var(--ink-2);line-height:1.5;word-break:keep-all;display:flex;gap:8px}
.qline b{color:var(--navy);flex:none}

.stage{position:relative;width:100%;aspect-ratio:4/3;max-height:360px;margin:0 auto;border-radius:12px;background:var(--screen);overflow:hidden}
.stage::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 3px transparent;transition:box-shadow .2s;pointer-events:none}
.stage.good::after{box-shadow:inset 0 0 0 3px var(--good)}
.stage.mid::after{box-shadow:inset 0 0 0 3px #e8862a}
.stage.low::after{box-shadow:inset 0 0 0 3px var(--low)}
.stage.rec::after{box-shadow:inset 0 0 0 3px #ff5a4a}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--screen)}
#live{transform:scaleX(-1)}
#playback{object-fit:contain;display:none}
.playing #playback{display:block}
.playing #live{visibility:hidden}

.ov{position:absolute;z-index:2;font-size:12px;font-weight:600;color:#fff;background:rgba(10,15,30,.55);backdrop-filter:blur(4px);border-radius:7px;padding:4px 9px;display:flex;align-items:center;gap:6px}
.tl{top:10px;left:10px}.tr{top:10px;right:10px}
.dot{width:7px;height:7px;border-radius:50%;background:#ff5a4a}
.rec-tag{display:none}.recording .rec-tag{display:flex}
.recording .rec-tag .dot{animation:blink 1s infinite}
.play-tag{display:none}.playing .play-tag{display:flex}
@keyframes blink{50%{opacity:.25}}
.gz{display:none}.gz.good,.gz.mid,.gz.low{display:flex}
.gz.good .dot{background:#3ddc84}.gz.mid .dot{background:#ffb54a}.gz.low .dot{background:#ff5a4a}
.hud{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(10,15,30,.65));display:flex;align-items:flex-end;justify-content:space-between;gap:12px;color:#fff}
.playing .hud,.off .hud{display:none}
.time{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;line-height:1}
.time.low{color:#ff8a7a}
.mic{display:flex;align-items:flex-end;gap:3px;height:18px}
.mic i{width:4px;border-radius:2px;background:rgba(255,255,255,.35);height:30%}
.mic i.on{background:#3ddc84}
.mic-label{font-size:11px;opacity:.8;margin-right:6px;align-self:center}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:3;background:rgba(255,255,255,.15)}
.prog i{display:block;height:100%;width:100%;background:#fff;transition:width .25s linear}
.playing .prog,.off .prog{display:none}
.cover{position:absolute;inset:0;z-index:4;display:none;place-items:center;align-content:center;gap:14px;text-align:center;padding:24px;color:#c9d1e3}
.cover p{margin:0;font-size:14px;max-width:280px}
.off .cover{display:grid}
.count{position:absolute;inset:0;z-index:5;display:none;place-items:center;font-size:92px;font-weight:800;color:#fff;background:rgba(19,32,63,.5)}
.count.on{display:grid}
.count small{display:block;font-size:15px;font-weight:600;text-align:center;opacity:.85;margin-top:-6px}

.btns{display:grid;grid-template-columns:1fr auto;gap:8px}
button.b{font:inherit;font-size:15px;font-weight:600;height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.b:hover{background:var(--navy-50)}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
button.primary:hover{background:var(--navy-700)}
button.stop{background:var(--low);border-color:var(--low);color:#fff}
button.stop:hover{background:#a63524}
button.b:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid #9fb0dc;outline-offset:2px}
.rdot{width:10px;height:10px;border-radius:50%;background:#ff5a4a}
.sq{width:10px;height:10px;border-radius:2px;background:#fff}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--navy-50);border-radius:9px;padding:7px 10px}
.kpi .k{font-size:12px;color:var(--ink-3)}
.kpi .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.msg{font-size:14px;border-radius:10px;padding:10px 12px;display:none;line-height:1.5}
.msg.on{display:block}
.msg.ok{background:var(--good-bg);color:#17643c}
.msg.err{background:var(--low-bg);color:#8e2c1e}
.note{font-size:12px;color:var(--ink-3);margin:0}
@media (max-width:420px){ .time{font-size:26px} .btns{grid-template-columns:1fr} .head{gap:10px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="box">
  <div class="head">
    <b>답변 녹화</b>
    <div class="chips" id="chips" role="group" aria-label="답변 시간">
      <button data-s="60">60초</button><button data-s="90">90초</button><button data-s="120">2분</button>
    </div>
  </div>
  <div class="qline" id="qline" hidden><b>질문</b><span id="qtext"></span></div>

  <div class="stage off" id="stage">
    <video id="live" playsinline muted></video>
    <video id="playback" playsinline controls></video>
    <span class="ov tl rec-tag"><span class="dot"></span>녹화 중</span>
    <span class="ov tl play-tag">방금 녹화한 답변</span>
    <span class="ov tr gz" id="gaze"><span class="dot"></span><span id="gazeText"></span></span>
    <div class="hud">
      <div class="time" id="time">1:00</div>
      <div class="mic" id="mic" aria-label="마이크 소리 크기"><span class="mic-label">마이크</span><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="prog"><i id="prog"></i></div>
    <div class="cover">
      <p>카메라와 마이크를 켜면 내 모습을 보면서 답변을 녹화할 수 있습니다.</p>
      <button class="b primary" id="on">카메라와 마이크 켜기</button>
    </div>
    <div class="count" id="count"><div><span id="countN">3</span><small>곧 녹화가 시작됩니다</small></div></div>
  </div>

  <div class="btns">
    <button class="b primary" id="main" disabled><span class="rdot"></span><span id="mainText">녹화 시작</span></button>
    <button class="b" id="side" disabled>카메라 끄기</button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="kpis">
    <div class="kpi"><div class="k">정면 응시</div><div class="v" id="k1">–</div></div>
    <div class="kpi"><div class="k">얼굴 인식</div><div class="v" id="k2">–</div></div>
    <div class="kpi"><div class="k">눈 깜빡임/분</div><div class="v" id="k3">–</div></div>
  </div>
  <p class="note" id="note">녹화 시작을 누르면 3초 뒤부터 기록하고, 시간이 다 되면 자동으로 멈춥니다. 영상은 이 컴퓨터 안에서만 쓰이고 평가에는 목소리만 보냅니다.</p>
</div>

<script type="module">
/* ---------- Streamlit 연결 ---------- */
const send = (type, data = {}) => window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
const setHeight = () => send("streamlit:setFrameHeight", { height: document.documentElement.scrollHeight });
new ResizeObserver(setHeight).observe(document.body);
let token = "", seconds = 60, userPicked = false, pending = { token: "", question: "" }, recToken = "";
/* 녹화 중에 질문을 넘겨도 녹화는 시작할 때의 질문에 붙도록, 질문 변경은 녹화가 끝난 뒤 반영 */
function applyQuestion() {
  $("qtext").textContent = pending.question;
  $("qline").hidden = !pending.question;
  if (pending.token !== token) { token = pending.token; toLive(); resetTimer(); hideMsg(); }
}
window.addEventListener("message", (e) => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  const a = e.data.args || {};
  if (!userPicked && a.seconds) { seconds = a.seconds; markChips(); }
  pending = { token: a.token || "", question: a.question || "" };
  if (!recording && !counting) applyQuestion();
  setHeight();
});
send("streamlit:componentReady", { apiVersion: 1 });

/* ---------- 요소 ---------- */
const $ = (id) => document.getElementById(id);
const stage = $("stage"), live = $("live"), playback = $("playback");
let stream = null, recording = false, counting = false, mediaRec = null, chunks = [], lastUrl = null;
let audioCtx = null, analyser = null, pcm = [], sampleRate = 48000;
let left = 60, tickT = null, startedAt = 0, stopReason = "user";

const fmt = (s) => Math.floor(Math.max(0, s) / 60) + ":" + String(Math.max(0, s) % 60).padStart(2, "0");
function drawTimer() {
  $("time").textContent = fmt(left);
  $("time").classList.toggle("low", left <= 10);
  $("prog").style.width = (left / seconds * 100) + "%";
}
function resetTimer() { left = seconds; drawTimer(); }
function markChips() { document.querySelectorAll("#chips button").forEach((b) => b.classList.toggle("on", +b.dataset.s === seconds)); }
document.querySelectorAll("#chips button").forEach((b) => b.onclick = () => {
  if (recording || counting) return;
  seconds = +b.dataset.s; userPicked = true; markChips(); resetTimer();
});
function showMsg(t, k) { const m = $("msg"); m.textContent = t; m.className = "msg on " + k; setHeight(); }
function hideMsg() { $("msg").className = "msg"; setHeight(); }
function setGaze(text, cls) {
  const g = $("gaze"); g.className = "ov tr gz " + (cls || ""); $("gazeText").textContent = text;
  stage.classList.remove("good", "mid", "low"); if (cls && !recording) stage.classList.add(cls);
}
function setMain(text, kind, icon) {
  $("mainText").textContent = text; $("main").className = "b " + kind;
  $("main").querySelector("span").className = icon;
}

/* ---------- 카메라·마이크 ---------- */
$("on").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
      audio: { echoCancellation: true, noiseSuppression: true },
    });
  } catch (err) {
    const denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
    showMsg(denied
      ? "카메라·마이크 사용이 막혀 있습니다. 주소창 왼쪽 자물쇠 아이콘에서 카메라와 마이크를 허용한 뒤 다시 눌러 주세요."
      : "카메라나 마이크를 찾지 못했습니다. 연결을 확인하고, 다른 프로그램(Zoom 등)이 쓰고 있다면 끈 뒤 다시 눌러 주세요.", "err");
    return;
  }
  live.srcObject = stream;
  await live.play().catch(() => {});
  stage.classList.remove("off");
  $("main").disabled = false; $("side").disabled = false;
  hideMsg(); setupAudio(); loadFace();
  $("note").hidden = true;
};

function cameraOff() {
  stream?.getTracks().forEach((t) => t.stop());
  stream = null; live.srcObject = null;
  audioCtx?.close(); audioCtx = null; analyser = null;
  stage.classList.add("off"); toLive();
  $("main").disabled = true; $("side").disabled = true;
  setGaze("", "");
}

function setupAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  sampleRate = audioCtx.sampleRate;
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
  const proc = audioCtx.createScriptProcessor(4096, 1, 1);
  const mute = audioCtx.createGain(); mute.gain.value = 0;
  src.connect(analyser); src.connect(proc); proc.connect(mute); mute.connect(audioCtx.destination);
  proc.onaudioprocess = (e) => { if (recording) pcm.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  const buf = new Uint8Array(analyser.fftSize), bars = [...document.querySelectorAll("#mic i")];
  const meter = () => {
    if (!analyser) return;
    analyser.getByteTimeDomainData(buf);
    let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
    const lvl = Math.min(1, peak / 60);
    bars.forEach((b, i) => { b.style.height = (30 + i * 17) + "%"; b.classList.toggle("on", lvl > (i + 0.5) / 6); });
    requestAnimationFrame(meter);
  };
  meter();
}

/* ---------- 다시 보기 / 실시간 전환 ---------- */
function toLive() {
  playback.pause(); stage.classList.remove("playing");
  if (pending.token !== token && !recording && !counting) { token = pending.token; }
  if (stream) { setMain("녹화 시작", "primary", "rdot"); $("side").textContent = "카메라 끄기"; }
}
function toPlayback(url) {
  playback.src = url; stage.classList.add("playing");
  setMain("다시 녹화", "primary", "rdot"); $("side").textContent = "카메라로 돌아가기";
}

$("main").onclick = () => {
  if (recording) { stopRecording(); return; }
  if (stage.classList.contains("playing")) toLive();
  countdown();
};
$("side").onclick = () => {
  if (recording) return;
  if (stage.classList.contains("playing")) { toLive(); return; }
  cameraOff();
};

/* ---------- 녹화 ---------- */
function countdown() {
  if (!stream || counting) return;
  counting = true; hideMsg(); audioCtx?.resume();
  $("main").disabled = true; $("side").disabled = true;
  document.querySelectorAll("#chips button").forEach((b) => (b.disabled = true));
  let n = 3; $("countN").textContent = n; $("count").classList.add("on");
  const t = setInterval(() => {
    n--;
    if (n > 0) { $("countN").textContent = n; return; }
    clearInterval(t); $("count").classList.remove("on"); counting = false; startRecording();
  }, 1000);
}

function pickMime() {
  const opts = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
  return opts.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}

function startRecording() {
  chunks = []; pcm = [];
  const mime = pickMime();
  mediaRec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 900000 } : undefined);
  mediaRec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  mediaRec.onstop = finish;
  mediaRec.start(1000);
  recording = true; recToken = token; startedAt = performance.now(); stats.reset();
  stage.classList.add("recording", "rec"); stage.classList.remove("good", "mid", "low");
  $("main").disabled = false;
  setMain("답변 끝내기", "stop", "sq");
  left = seconds; drawTimer();
  tickT = setInterval(() => {
    left = seconds - Math.floor((performance.now() - startedAt) / 1000);
    drawTimer();
    if (left <= 0) { stopReason = "time"; stopRecording(); }
  }, 250);
}

function stopRecording() {
  if (!recording) return;
  recording = false; clearInterval(tickT);
  stage.classList.remove("recording", "rec");
  $("side").disabled = false;
  document.querySelectorAll("#chips button").forEach((b) => (b.disabled = false));
  mediaRec.stop();
}

async function finish() {
  const reason = stopReason; stopReason = "user";
  const dur = (performance.now() - startedAt) / 1000;
  resetTimer();
  if (dur < 2) { setMain("녹화 시작", "primary", "rdot"); showMsg("녹화가 너무 짧습니다. 다시 녹화해 주세요.", "err"); applyQuestion(); return; }
  const mime = (mediaRec.mimeType || "video/webm").split(";")[0];
  const blob = new Blob(chunks, { type: mime });
  if (lastUrl) URL.revokeObjectURL(lastUrl);
  lastUrl = URL.createObjectURL(blob);
  toPlayback(lastUrl);
  showMsg("녹화를 정리하는 중입니다…", "ok");
  const wav = encodeWav(pcm, sampleRate, 16000);
  const [videoB64, wavB64] = await Promise.all([toB64(blob), toB64(new Blob([wav], { type: "audio/wav" }))]);
  send("streamlit:setComponentValue", {
    dataType: "json",
    value: { id: Date.now() + "-" + Math.random().toString(36).slice(2, 8), token: recToken, mime,
             video_b64: videoB64, wav_b64: wavB64, duration: Math.round(dur * 10) / 10, face: stats.summary(dur) },
  });
  showMsg((reason === "time" ? "시간이 다 되어 녹화를 멈췄습니다" : "녹화를 마쳤습니다")
          + ` (${fmt(Math.round(dur))}). 바로 아래에서 평가를 받을 수 있습니다.`, "ok");
  if (pending.token !== recToken) { /* 녹화 중 질문이 바뀐 경우 */ $("qtext").textContent = pending.question; }
}

function toB64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1] || "");
    r.onerror = rej; r.readAsDataURL(blob);
  });
}

function encodeWav(parts, inRate, outRate) {
  let len = 0; for (const p of parts) len += p.length;
  const all = new Float32Array(len); let o = 0; for (const p of parts) { all.set(p, o); o += p.length; }
  const ratio = inRate / outRate, n = Math.floor(all.length / ratio);
  const out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const s = Math.floor(i * ratio), e = Math.min(all.length, Math.floor((i + 1) * ratio));
    let sum = 0; for (let j = s; j < e; j++) sum += all[j];
    const v = Math.max(-1, Math.min(1, sum / Math.max(1, e - s)));
    out[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  const buf = new ArrayBuffer(44 + out.length * 2), dv = new DataView(buf);
  const w = (off, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(off + i, str.charCodeAt(i)); };
  w(0, "RIFF"); dv.setUint32(4, 36 + out.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, outRate, true); dv.setUint32(28, outRate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  w(36, "data"); dv.setUint32(40, out.length * 2, true);
  new Int16Array(buf, 44).set(out);
  return buf;
}

/* ---------- 시선·표정 분석 (MediaPipe, 브라우저 안에서만) ---------- */
const MP_VER = "0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const LOOK = ["eyeLookOutLeft","eyeLookOutRight","eyeLookInLeft","eyeLookInRight","eyeLookUpLeft","eyeLookUpRight","eyeLookDownLeft","eyeLookDownRight"];
let landmarker = null, faceReady = false, faceLoading = false;

const stats = {
  reset() { this.frames = 0; this.face = 0; this.front = 0; this.smile = 0; this.blinks = 0; this.closed = false; this.nose = []; },
  summary(dur) {
    if (!faceReady || this.frames < 10) return {};
    const ff = Math.max(this.face, 1);
    let sway = null;
    if (this.nose.length > 5) {
      const sd = (a) => { const m = a.reduce((x, y) => x + y, 0) / a.length; return Math.sqrt(a.reduce((x, y) => x + (y - m) ** 2, 0) / a.length); };
      sway = (sd(this.nose.map((p) => p[0])) + sd(this.nose.map((p) => p[1]))) / 2 * 100;
    }
    const r = (x, d = 3) => Math.round(x * 10 ** d) / 10 ** d;
    return { seconds: r(dur, 1), frames: this.frames, face_rate: r(this.face / this.frames), front_rate: r(this.front / ff),
             smile_rate: r(this.smile / ff), blinks_per_min: r(this.blinks / (dur / 60), 1),
             head_sway_pct: sway === null ? null : r(sway, 2), live_front: null };
  },
};
stats.reset();

async function loadFace() {
  if (faceReady || faceLoading) return;
  faceLoading = true; setGaze("시선 분석 준비 중", "");
  $("gaze").className = "ov tr gz mid";
  try {
    let mod;
    try { mod = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`); }
    catch { mod = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/+esm`); }
    const { FaceLandmarker, FilesetResolver } = mod;
    const files = await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/wasm`);
    const opts = (delegate) => ({ baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: true });
    try { landmarker = await FaceLandmarker.createFromOptions(files, opts("GPU")); }
    catch { landmarker = await FaceLandmarker.createFromOptions(files, opts("CPU")); }
    faceReady = true;
    requestAnimationFrame(faceLoop);
  } catch (err) {
    setGaze("", "");
    $("note").textContent = "시선 분석 도구를 불러오지 못했습니다(인터넷 연결 확인). 녹화와 목소리 평가는 그대로 됩니다.";
    setHeight();
  } finally { faceLoading = false; }
}

let lastT = -1, skip = 0;
function faceLoop() {
  if (stream && landmarker && live.readyState >= 2 && (skip++ % 2 === 0)) {
    const t = performance.now();
    if (t > lastT) { lastT = t; analyze(landmarker.detectForVideo(live, t)); }
  }
  requestAnimationFrame(faceLoop);
}

function analyze(res) {
  const has = res && res.faceLandmarks && res.faceLandmarks.length;
  if (recording) stats.frames++;
  if (!has) { setGaze("얼굴 안 보임", "low"); showKpis(); return; }
  const lm = res.faceLandmarks[0];
  const bs = {}; (res.faceBlendshapes?.[0]?.categories || []).forEach((c) => (bs[c.categoryName] = c.score));
  const lc = lm[234], rc = lm[454], nose = lm[1], top = lm[10], chin = lm[152];
  const yaw = (nose.x - lc.x) / Math.max(rc.x - lc.x, 1e-6);
  const pitch = (nose.y - top.y) / Math.max(chin.y - top.y, 1e-6);
  const front = yaw > 0.38 && yaw < 0.62 && pitch > 0.35 && pitch < 0.65 && Math.max(...LOOK.map((k) => bs[k] || 0)) < 0.55;
  setGaze(front ? "정면" : "시선 벗어남", front ? "good" : "mid");
  if (recording) {
    stats.face++;
    if (front) stats.front++;
    if (((bs.mouthSmileLeft || 0) + (bs.mouthSmileRight || 0)) / 2 > 0.4) stats.smile++;
    const blink = ((bs.eyeBlinkLeft || 0) + (bs.eyeBlinkRight || 0)) / 2;
    if (blink > 0.5 && !stats.closed) { stats.blinks++; stats.closed = true; } else if (blink < 0.3) stats.closed = false;
    stats.nose.push([nose.x, nose.y]);
  }
  showKpis();
}

let kpiT = 0;
function showKpis() {
  if (!recording) return;
  const now = performance.now(); if (now - kpiT < 500) return; kpiT = now;
  const s = stats.summary((now - startedAt) / 1000);
  if (!s.frames) return;
  $("k1").textContent = Math.round(s.front_rate * 100) + "%";
  $("k2").textContent = Math.round(s.face_rate * 100) + "%";
  $("k3").textContent = Math.round(s.blinks_per_min);
}

markChips(); drawTimer(); setHeight();
</script>
</body>
